[package]
name = "tantra-exec-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Canonical broker execution interfaces: BrokerExecutor trait v2, ExecutionStream, exact-decimal wire helpers, and the prioritized token-bucket rate limiter"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
prometheus.workspace = true
rust_decimal.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# WASM-safe tokio (E8): only sync/macros/io-util/rt/time are supported on
# wasm32-unknown-unknown. The workspace `tokio` enables `net`+`rt-multi-thread`
# for broker adapters; tantra-exec-core needs none of those, so a direct,
# trimmed dependency keeps `tantra-exec-paper` wasm-targetable while feature
# unification restores the full set for native workspace builds.
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "io-util", "macros"] }
tracing.workspace = true
uuid.workspace = true
tantra-core.workspace = true
tantra-risk.workspace = true
once_cell.workspace = true
opentelemetry.workspace = true
tracing-opentelemetry.workspace = true

[dev-dependencies]
# Paused-time scheduler tests (tokio::time::advance).
tokio = { workspace = true, features = ["test-util"] }
